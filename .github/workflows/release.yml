name: release

on:
    push:
        tags:
            - 'v*' # Ex: v1.2.3 → publish as latest
            - 'beta/*' # Ex: beta/1.2.3-beta.1 → publish as beta

permissions:
    contents: write # To create a GitHub Release
    id-token: write # For npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: write # To create a GitHub Release

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Full history: the ancestry check below needs a common
                  # ancestor between the tag commit and main.
                  fetch-depth: 0

            - name: Verify tag is on main branch
              run: |
                  # Do NOT use --depth=1 here (nor a shallow checkout above).
                  # Two shallow fetches leave the tag commit and origin/main as
                  # disconnected histories with no shared parent, so
                  # `git merge-base --is-ancestor` always reports "not an
                  # ancestor" — even for tags that are genuinely on main.
                  git fetch origin main
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                    echo "::error ::❌ Tag commit is not on main branch — release cancelled"
                    exit 1
                  fi
                  echo "✅ Tag is on main branch"

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org/'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm run build

            - name: Run tests
              run: pnpm test

            - name: Verify package.json version matches tag
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME=${GITHUB_REF#refs/tags/}

                  # Hantera både vX.X.X och beta/X.X.X-beta.X
                  if [[ "$TAG_NAME" == beta/* ]]; then
                    TAG_VERSION=${TAG_NAME#beta/}
                  else
                    TAG_VERSION=${TAG_NAME#v}
                  fi

                  echo "Package version: $PKG_VERSION"
                  echo "Tag version:     $TAG_VERSION"

                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                    echo "::error ::❌ Version mismatch: package.json=$PKG_VERSION ≠ tag=$TAG_VERSION"
                    exit 1
                  else
                    echo "✅ Version match confirmed"
                  fi

            # Publishes here authenticate through OIDC trusted publishing
            # (id-token: write) and sign provenance, so no NPM_TOKEN is needed.
            # setup-node's registry-url still writes an .npmrc placeholder for
            # one, which logs a harmless WARN about the unset variable.

            - name: Check whether the version is already on npm
              id: published
              run: |
                  PKG=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")

                  if npm view "$PKG@$VERSION" version > /dev/null 2>&1; then
                    echo "already=true" >> "$GITHUB_OUTPUT"
                    echo "✅ $PKG@$VERSION is already published — publish is skipped"
                  else
                    echo "already=false" >> "$GITHUB_OUTPUT"
                    echo "ℹ️ $PKG@$VERSION is not on npm yet"
                  fi

            - name: Publish to npm (beta)
              if: startsWith(github.ref, 'refs/tags/beta/') && steps.published.outputs.already != 'true'
              run: pnpm publish --tag beta --provenance --access public --no-git-checks

            - name: Publish to npm (latest)
              if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.already != 'true'
              run: pnpm publish --provenance --access public --no-git-checks

            # `pnpm publish` exits 0 even when npm accepts the package into its
            # staged-publishing queue instead of making it installable, so a
            # green publish step says nothing about the registry. This step asks
            # the registry, and a queued version never turns up there.
            - name: Verify the version is installable
              run: |
                  PKG=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  ATTEMPTS=${VERIFY_ATTEMPTS:-20}
                  DELAY=${VERIFY_DELAY:-15}

                  for attempt in $(seq 1 "$ATTEMPTS"); do
                    if curl -fsS "https://registry.npmjs.org/$PKG/$VERSION" > /dev/null 2>&1; then
                      echo "✅ $PKG@$VERSION is installable from the registry"

                      if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                        LATEST=$(npm view "$PKG" dist-tags.latest 2>/dev/null || echo "")
                        if [ "$LATEST" != "$VERSION" ]; then
                          echo "::error ::❌ $PKG@$VERSION is published but dist-tag 'latest' points at '$LATEST'"
                          exit 1
                        fi
                        echo "✅ dist-tag 'latest' points at $VERSION"
                      fi

                      exit 0
                    fi

                    echo "… attempt $attempt/$ATTEMPTS: $VERSION is not in the registry yet, retrying in ${DELAY}s"
                    sleep "$DELAY"
                  done

                  echo "::error ::❌ $PKG@$VERSION did not reach the registry. It is most likely waiting in npm's staged-publishing queue, where a maintainer has to approve it with 2FA at https://www.npmjs.com/package/$PKG. Re-run this job after approving: the publish step is skipped once the version is live, and the GitHub Release is created on that run."
                  exit 1

            # Reachable only when the registry confirmed the version above, so a
            # queued publish never produces release notes for a version nobody
            # can install.
            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  generate_release_notes: true
