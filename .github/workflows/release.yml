name: release

on:
    push:
        tags:
            - 'v*' # Ex: v1.2.3 → publish as latest
            - 'beta/*' # Ex: beta/1.2.3-beta.1 → publish as beta

permissions:
    contents: write # To create a GitHub Release
    id-token: write # For npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: write # To create a GitHub Release

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Verify tag is on main branch
              run: |
                  git fetch origin main --depth=1
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                    echo "::error ::❌ Tag commit is not on main branch — release cancelled"
                    exit 1
                  fi
                  echo "✅ Tag is on main branch"

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org/'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm run build

            - name: Run tests
              run: pnpm test

            - name: Verify package.json version matches tag
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME=${GITHUB_REF#refs/tags/}

                  # Hantera både vX.X.X och beta/X.X.X-beta.X
                  if [[ "$TAG_NAME" == beta/* ]]; then
                    TAG_VERSION=${TAG_NAME#beta/}
                  else
                    TAG_VERSION=${TAG_NAME#v}
                  fi

                  echo "Package version: $PKG_VERSION"
                  echo "Tag version:     $TAG_VERSION"

                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                    echo "::error ::❌ Version mismatch: package.json=$PKG_VERSION ≠ tag=$TAG_VERSION"
                    exit 1
                  else
                    echo "✅ Version match confirmed"
                  fi

            - name: Publish to npm (beta)
              if: startsWith(github.ref, 'refs/tags/beta/')
              run: pnpm publish --tag beta --provenance --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm (latest)
              if: startsWith(github.ref, 'refs/tags/v')
              run: pnpm publish --provenance --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
              with:
                  generate_release_notes: true
